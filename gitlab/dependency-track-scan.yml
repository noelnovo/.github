# Generic GitLab entrypoint. Register a project in gitlab_profiles.json, then
# pin this file and SECURITY_CONTROL_SHA from a reviewed immutable release.
.security-control:
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: none
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: ""
    DOCKER_CERT_PATH: ""
    SECURITY_CONTROL_SHA: de81cdf477c491a5adac5b80f3bfee626fdf5b02
  before_script:
    - apk add --no-cache python3 git >/dev/null
    - |
      set -eu
      export SECURITY_CONTROL_DIR="$(mktemp -d)"
      git -C "$SECURITY_CONTROL_DIR" init -q
      git -C "$SECURITY_CONTROL_DIR" fetch -q --depth=1 https://github.com/noelnovo/.github.git "$SECURITY_CONTROL_SHA"
      git -C "$SECURITY_CONTROL_DIR" checkout -q --detach FETCH_HEAD
      test "$(git -C "$SECURITY_CONTROL_DIR" rev-parse HEAD)" = "$SECURITY_CONTROL_SHA"
  cache: []
  interruptible: false
  rules:
    - if: '$VAULT_RENEW_ONLY == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH'

security-build:
  extends: .security-control
  stage: test
  script:
    - python3 -u "$SECURITY_CONTROL_DIR/security/gitlab_gate.py" build
  artifacts:
    name: security-$CI_PIPELINE_ID-$CI_COMMIT_SHA
    expire_in: 1 day
    paths:
      - security-output/bom.json
      - security-output/receipt.json
      - security-output/lcov.info
      - security-output/python.xml

security:
  extends: .security-control
  stage: security
  needs:
    - job: security-build
      artifacts: true
  resource_group: sonarqube-dtrack-$CI_PROJECT_ID
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.int.downops.win
  script:
    - python3 -u "$SECURITY_CONTROL_DIR/security/gitlab_gate.py" scan
