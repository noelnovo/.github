name: Security controller tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security-control-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s security -p 'test_*.py'
