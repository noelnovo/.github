name: Reusable security - Dependency-Track and SonarQube
# Single security entrypoint. Repository-specific settings are reviewed in
# security/profiles.json, not supplied by PR-controlled inputs or static secrets.
# Existing immutable older commits remain usable during the caller migration.
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: reusable-security-${{ github.repository_id }}-${{ github.event.pull_request.number || github.ref }}
  queue: max
  cancel-in-progress: false
jobs:
  candidate:
    name: Candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      candidate: ${{ steps.context.outputs.candidate }}
      hugo_baseurl: ${{ steps.context.outputs.hugo_baseurl }}
      adapter: ${{ steps.context.outputs.adapter }}
      reuse_android: ${{ steps.context.outputs.reuse_android }}
      target: ${{ steps.context.outputs.target }}
      analysis_group: ${{ steps.context.outputs.analysis_group }}
      coverage_format: ${{ steps.context.outputs.coverage_format }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: noelnovo/.github
          ref: 3508bacfb132afaaebab74de5c14b4765ce1ec85
          path: security-control
          persist-credentials: false
      - id: context
        run: python3 security-control/security/premerge.py context
        env:
          SECURITY_CONTROL_SHA: 3508bacfb132afaaebab74de5c14b4765ce1ec85
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Build and SBOM
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Executes untrusted Dockerfile/build code on its own hosted VM. No Vault,
    # OIDC, registry login, scanner key, status write or environment secrets.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: needs.candidate.outputs.reuse_android != 'true'
        with:
          ref: ${{ needs.candidate.outputs.candidate }}
          persist-credentials: false
      - name: Build candidate without credentials
        if: needs.candidate.outputs.adapter == 'image'
        env:
          SOURCE_CANDIDATE: ${{ needs.candidate.outputs.candidate }}
          HUGO_BASEURL: ${{ needs.candidate.outputs.hugo_baseurl }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_CANDIDATE"
          args=()
          if [ -n "$HUGO_BASEURL" ]; then args+=(--build-arg "HUGO_BASEURL=$HUGO_BASEURL"); fi
          docker build --label "org.opencontainers.image.revision=$SOURCE_CANDIDATE" \
            "${args[@]}" -t security-candidate:ci .
          docker save -o security-image.tar security-candidate:ci
      - name: Generate resolved runtime-image CycloneDX SBOM
        if: needs.candidate.outputs.adapter == 'image'
        run: |
          docker run --rm --volume "$PWD:/work:ro" \
            anchore/syft@sha256:03215d0e98b661d0ecbc8575dbc14d65be1743b5de5df6410aecb7e80f95b060 \
            docker-archive:/work/security-image.tar -o cyclonedx-json > bom.json
      - name: Export genuine same-candidate JavaScript coverage without credentials
        if: needs.candidate.outputs.adapter == 'image' && needs.candidate.outputs.coverage_format == 'lcov'
        run: docker build --target security-coverage --output type=local,dest=coverage .
      - uses: actions/setup-java@v4
        if: needs.candidate.outputs.adapter == 'android' && needs.candidate.outputs.reuse_android != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: needs.candidate.outputs.adapter == 'android' && needs.candidate.outputs.reuse_android != 'true'
        with:
          packages: platform-tools
      - name: Compile Android candidate and resolve CycloneDX without credentials
        if: needs.candidate.outputs.adapter == 'android' && needs.candidate.outputs.reuse_android != 'true'
        env:
          SOURCE_CANDIDATE: ${{ needs.candidate.outputs.candidate }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_CANDIDATE"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python3 -m unittest discover -s tests/automation -p 'test_*.py'
          python3 -m unittest discover -s ci -p 'test_*.py'
          sh gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest jacocoTestReport cyclonedxBom
      - name: Reuse the same-run Android validation build on protected pushes
        if: needs.candidate.outputs.reuse_android == 'true'
        uses: actions/download-artifact@v4
        with:
          name: security-input-${{ needs.candidate.outputs.candidate }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: needs.candidate.outputs.adapter == 'image'
        with:
          name: security-bom-${{ needs.candidate.outputs.candidate }}-${{ github.run_attempt }}
          path: |
            bom.json
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: needs.candidate.outputs.adapter == 'android'
        with:
          name: security-bom-${{ needs.candidate.outputs.candidate }}-${{ github.run_attempt }}
          path: |
            build/reports/cyclonedx/bom.json
            app/build/reports/jacoco/**/jacocoTestReport.xml
            app/build/intermediates/javac/**/classes/**
            app/build/tmp/kotlin-classes/**
            app/build/intermediates/built_in_kotlinc/**/classes/**
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: SonarQube + Dependency-Track (${{ github.base_ref || github.ref_name }})
    if: always()
    needs: [candidate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ needs.candidate.outputs.analysis_group || format('sonar-dtrack-analysis-{0}', github.repository_id) }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Literal reviewed code pin, never a caller-provided ref or PR script.
          repository: noelnovo/.github
          ref: 3508bacfb132afaaebab74de5c14b4765ce1ec85
          path: security-control
          persist-credentials: false
      - name: Evaluate updated Dependency-Track metrics through SonarQube
        run: python3 security-control/security/premerge.py gate
        env:
          SECURITY_CONTROL_SHA: 3508bacfb132afaaebab74de5c14b4765ce1ec85
          SECURITY_BUILD_RESULT: ${{ needs.build.result }}
          SECURITY_CANDIDATE: ${{ needs.candidate.outputs.candidate }}
          GITHUB_TOKEN: ${{ github.token }}
